{{define "screen1"}}
<div class="step-enter" x-data="{
    mode: 'url',
    url: '',
    selectedFile: null,
    selectedFolder: null,
    uploading: false,
    error: '',
    status: '',
    handleFileSelect(event) {
        this.selectedFile = event.target.files[0];
        this.selectedFolder = null;
        this.error = '';
    },
    handleFolderSelect(event) {
        this.selectedFolder = event.target.files;
        this.selectedFile = null;
        this.error = '';
    },
    async upload() {
        this.uploading = true;
        this.error = '';
        this.status = 'Creating project...';
        try {
            const projResp = await fetch('/api/projects', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    project_name: this.selectedFile ? this.selectedFile.name.replace('.zip','') : 'uploaded-project',
                    source_type: 'upload'
                })
            });
            const proj = await projResp.json();
            const projectId = proj.id;
            this.status = 'Uploading files...';
            const formData = new FormData();
            if (this.selectedFile) {
                formData.append('file', this.selectedFile);
            } else if (this.selectedFolder) {
                for (const file of this.selectedFolder) {
                    formData.append('files', file);
                }
            }
            const uploadResp = await fetch('/projects/' + projectId + '/source/upload', {
                method: 'POST',
                body: formData
            });
            if (!uploadResp.ok) {
                throw new Error(await uploadResp.text());
            }
            this.status = 'Redirecting...';
            window.location.href = '/wizard/2?project_id=' + projectId;
        } catch (e) {
            this.error = e.message;
            this.uploading = false;
        }
    }
}">
    <h2 class="screen-title">Create App</h2>
    <p class="screen-description">Choose how to build your app</p>

    <!-- Source Type Tabs -->
    <div style="display:flex;gap:0.5rem;margin-bottom:1.5rem;">
        <button type="button" 
                @click="mode='url'" 
                :class="mode==='url' ? 'btn-primary' : 'btn-secondary'"
                class="btn" style="flex:1;">
            🌐 From Website
        </button>
        <button type="button" 
                @click="mode='upload'" 
                :class="mode==='upload' ? 'btn-primary' : 'btn-secondary'"
                class="btn" style="flex:1;">
            📦 Upload Project
        </button>
    </div>

    <!-- URL Mode -->
    <div x-show="mode==='url'" x-transition>
        <form hx-post="/wizard/1?project_id={{.ProjectID}}"
              hx-target="#wizard-content"
              hx-swap="innerHTML">
            <input type="hidden" name="source_type" value="url">
            
            <div class="form-group">
                <label class="form-label">Website URL</label>
                <input type="url" 
                       name="url" 
                       x-model="url"
                       placeholder="https://example.com" 
                       class="form-input" 
                       required>
                <p style="font-size:0.7rem;color:var(--gray-400);margin-top:0.25rem;">
                    Your web app will load this URL inside a native shell
                </p>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width:100%;">
                    Continue →
                </button>
            </div>
        </form>
    </div>

    <!-- Upload Mode -->
    <div x-show="mode==='upload'" x-transition>
        <div class="form-group">
            <label class="form-label">Upload ZIP file</label>
            <input type="file" 
                   accept=".zip"
                   @change="handleFileSelect"
                   x-ref="zipInput"
                   class="form-input" 
                   style="padding:0.5rem;">
            <p style="font-size:0.7rem;color:var(--gray-400);margin-top:0.25rem;">
                Static HTML/CSS/JS site, Vite, React, or Vue project
            </p>
        </div>

        <div style="text-align:center;color:var(--gray-400);margin:0.5rem 0;font-size:0.75rem;">
            — OR —
        </div>

        <div class="form-group">
            <label class="form-label">Upload folder</label>
            <input type="file" 
                   webkitdirectory
                   directory
                   multiple
                   @change="handleFolderSelect"
                   x-ref="folderInput"
                   class="form-input" 
                   style="padding:0.5rem;">
            <p style="font-size:0.7rem;color:var(--gray-400);margin-top:0.25rem;">
                Select the entire project folder
            </p>
        </div>

        <div x-show="uploading" style="text-align:center;padding:1rem;">
            <div class="spinner"></div>
            <p style="font-size:0.85rem;color:var(--gray-500);margin-top:0.5rem;" x-text="status"></p>
        </div>

        <div x-show="error" style="color:#dc2626;font-size:0.85rem;padding:0.5rem;background:#fee2e2;border-radius:0.5rem;margin-top:0.5rem;" x-text="error"></div>

        <div class="form-actions" x-show="!uploading">
            <button type="button" 
                    @click="upload"
                    :disabled="!selectedFile && !selectedFolder"
                    class="btn btn-primary" 
                    style="width:100%;">
                Upload & Continue →
            </button>
        </div>
    </div>
</div>

<style>
    .btn-secondary {
        background: #e5e7eb;
        color: #374151;
    }
    .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(99, 102, 241, 0.3);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>


{{end}}
