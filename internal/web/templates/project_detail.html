{{define "project_detail"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{.Project.AppName}}</title>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --accent: #6366f1;
            --danger: #ef4444;
            --radius: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        .header {
            background: var(--card);
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }
        
        .back-btn {
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--text);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .header-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        
        .header-name {
            font-size: 1.125rem;
            font-weight: 700;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem;
        }
        
        .section {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.125rem;
            margin-bottom: 0.875rem;
            border: 1px solid var(--border);
        }
        
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 0.75rem;
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--border);
        }
        
        .detail-row:last-child {
            border-bottom: none;
        }
        
        .detail-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }
        
        .detail-value {
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .color-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 0.375rem;
            vertical-align: middle;
            border: 1px solid rgba(0,0,0,0.1);
        }
        
        .status-pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.625rem;
            border-radius: 999px;
        }
        
        .status-draft { background: #f3f4f6; color: #6b7280; }
        .status-ready { background: #d1fae5; color: #065f46; }
        
        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 0.625rem;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.875rem 1.25rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9375rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
            min-height: 48px;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        .btn-primary {
            background: var(--accent);
            color: white;
        }
        
        .btn-secondary {
            background: #f3f4f6;
            color: var(--text);
        }
        
        .btn-danger {
            background: #fef2f2;
            color: var(--danger);
        }
        
        .btn-disabled {
            background: #f3f4f6;
            color: #9ca3af;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="/dashboard" class="back-btn">‹</a>
        <div class="header-icon" style="background-color: {{.Project.PrimaryColor}};">
            {{if .Project.AppName}}{{slice .Project.AppName 0 1}}{{else}}📱{{end}}
        </div>
        <span class="header-name">{{.Project.AppName}}</span>
    </header>
    
    <main class="main">
        <div class="section">
            <div class="section-title">Details</div>
            <div class="detail-row">
                <span class="detail-label">Website</span>
                <span class="detail-value">{{.Project.URL}}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Color</span>
                <span class="detail-value">
                    <span class="color-dot" style="background-color: {{.Project.PrimaryColor}};"></span>
                    {{.Project.PrimaryColor}}
                </span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="status-pill status-{{.Project.Status}}">{{.Project.Status}}</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Version</span>
                <span class="detail-value">v{{.Project.Version}}</span>
            </div>
        </div>
        
        <div class="section">
            <div class="section-title">Actions</div>
            <div class="action-btns">
                <a href="/wizard/2" class="btn btn-primary">Edit App</a>
                <button class="btn btn-secondary btn-disabled" disabled>Build APK — Soon</button>
                <form action="/projects/{{.Project.ID}}/delete" method="POST"
                      onsubmit="return confirm('Delete this app?');">
                    <button type="submit" class="btn btn-danger" style="width:100%;">Delete App</button>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
{{end}}
