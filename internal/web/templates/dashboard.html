{{define "dashboard"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>My Apps</title>
    <script src="/static/vendor/htmx.min.js"></script>
    <script src="/static/vendor/alpine.min.js" defer></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --text: #1a1a1a;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --accent: #6366f1;
            --danger: #ef4444;
            --radius: 16px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        
        /* Header */
        .header {
            background: var(--card);
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        
        .header-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        
        .header-badge {
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--accent);
            color: white;
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
        }
        
        /* Main */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 1.25rem;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        
        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .empty-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.375rem;
        }
        
        .empty-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        
        /* Project list */
        .project-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        
        .project-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1rem 1.125rem;
            display: flex;
            align-items: center;
            gap: 0.875rem;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid var(--border);
            text-decoration: none;
            color: inherit;
        }
        
        .project-card:active {
            transform: scale(0.98);
            background: #f3f4f6;
        }
        
        .project-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.125rem;
            color: white;
            flex-shrink: 0;
        }
        
        .project-info {
            flex: 1;
            min-width: 0;
        }
        
        .project-name {
            font-weight: 600;
            font-size: 0.9375rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .project-url {
            font-size: 0.75rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .project-chevron {
            color: var(--text-secondary);
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        
        /* Floating action button */
        .fab {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            text-decoration: none;
            z-index: 10;
        }
        
        .fab:active {
            transform: scale(0.9);
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>
    <header class="header">
        <span class="header-title">My Apps</span>
        <span class="header-badge">{{.Count}}</span>
    </header>
    
    <main class="main">
        {{if eq .Count 0}}
        <div class="empty-state">
            <div class="empty-icon">📱</div>
            <h2 class="empty-title">No apps yet</h2>
            <p class="empty-subtitle">Create your first app from a website</p>
        </div>
        {{else}}
        <div class="project-list">
            {{range .Projects}}
            <a href="/projects/{{.ID}}" class="project-card">
                <div class="project-icon" style="background-color: {{.PrimaryColor}};">
                    {{if .AppName}}{{slice .AppName 0 1}}{{else}}📱{{end}}
                </div>
                <div class="project-info">
                    <div class="project-name">{{.AppName}}</div>
                    <div class="project-url">{{.URL}}</div>
                </div>
                <span class="project-chevron">›</span>
            </a>
            {{end}}
        </div>
        {{end}}
    </main>
    
    <a href="/wizard/1" class="fab" aria-label="Create app">+</a>
</body>
</html>
{{end}}
