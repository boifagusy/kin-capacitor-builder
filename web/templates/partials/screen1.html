{{define "screen1"}}
<div class="bg-white shadow rounded-lg p-6">
    <h2 class="text-xl font-semibold mb-4">Enter Your Website URL</h2>
    <p class="text-gray-600 mb-6">We'll use this URL to create your mobile app.</p>
    <form hx-post="/wizard/1" hx-target="#wizard-content" hx-swap="innerHTML">
        <div class="mb-4">
            <label for="url" class="block text-sm font-medium text-gray-700 mb-2">Website URL</label>
            <input type="url" id="url" name="url" value="{{.Project.URL}}" placeholder="https://example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" required hx-post="/api/validate-url" hx-target="#url-validation" hx-trigger="blur, changed delay:500ms">
            <div id="url-validation" class="mt-2"></div>
            <p class="mt-2 text-sm text-gray-500">Enter the full URL including https:// or http://</p>
        </div>
        <div class="flex items-center justify-between">
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Continue to Branding</button>
        </div>
    </form>
</div>
{{end}}
