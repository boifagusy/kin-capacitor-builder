{{define "screen2"}}
<div class="bg-white shadow rounded-lg p-6">
    <h2 class="text-xl font-semibold mb-4">App Branding</h2>
    <p class="text-gray-600 mb-6">Customize your app's appearance.</p>
    <form hx-post="/wizard/2" hx-target="#wizard-content" hx-swap="innerHTML">
        <div class="mb-4">
            <label for="app_name" class="block text-sm font-medium text-gray-700 mb-2">App Name</label>
            <input type="text" id="app_name" name="app_name" value="{{.Project.AppName}}" placeholder="My Awesome App" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500" required>
        </div>
        <div class="mb-4">
            <label for="primary_color" class="block text-sm font-medium text-gray-700 mb-2">Primary Color</label>
            <div class="flex items-center space-x-4">
                <input type="color" id="primary_color" name="primary_color" value="{{.Project.PrimaryColor}}" class="h-10 w-20 border border-gray-300 rounded">
                <input type="text" id="primary_color_text" value="{{.Project.PrimaryColor}}" class="w-32 px-4 py-2 border border-gray-300 rounded-lg" placeholder="#000000">
            </div>
        </div>
        <div class="mb-6">
            <label for="logo_path" class="block text-sm font-medium text-gray-700 mb-2">Logo (Optional)</label>
            <input type="text" id="logo_path" name="logo_path" value="{{.Project.LogoPath}}" placeholder="/path/to/logo.png" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500">
            <p class="mt-2 text-sm text-gray-500">Logo file will be configured in a later step.</p>
        </div>
        <div class="flex items-center justify-between">
            <button type="button" hx-get="/wizard/1" hx-target="#wizard-content" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-400">Back</button>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">Save Branding</button>
        </div>
    </form>
</div>
{{end}}
