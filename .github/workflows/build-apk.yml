name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum
      
      - name: Build Go binary for Android ARM64
        run: |
          echo "=== Building Go binary for Android ==="
          mkdir -p capacitor/android/app/src/main/assets/go
          GOOS=android GOARCH=arm64 CGO_ENABLED=0 go build \
            -o capacitor/android/app/src/main/assets/go/local-apk-builder \
            ./cmd/app
          echo "=== Go binary built ==="
          ls -la capacitor/android/app/src/main/assets/go/local-apk-builder
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: capacitor/package-lock.json
      
      - name: Install Capacitor dependencies
        working-directory: capacitor
        run: |
          echo "=== Installing npm dependencies ==="
          npm ci
          echo "=== Verifying Capacitor plugins ==="
          npm list @capacitor/core @capacitor/android @capacitor/camera @capacitor/filesystem
      
      - name: Sync Capacitor Android
        working-directory: capacitor
        run: |
          echo "=== Syncing Capacitor ==="
          npx cap sync android
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install required Android SDK components
        run: |
          echo "=== Installing Android SDK packages ==="
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          echo "=== Installed SDK components ==="
          sdkmanager --list_installed
      
      - name: Generate local.properties
        working-directory: capacitor/android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "=== Generated local.properties ==="
          cat local.properties
      
      - name: Make Gradle wrapper executable
        working-directory: capacitor/android
        run: |
          chmod +x gradlew
          echo "=== Gradle wrapper permissions ==="
          ls -la gradlew
      
      - name: Build debug APK
        working-directory: capacitor/android
        run: |
          echo "=== Building APK with Gradle wrapper ==="
          ./gradlew assembleDebug --no-daemon --stacktrace
      
      - name: Verify APK exists
        working-directory: capacitor/android
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          echo "=== Verifying APK ==="
          if [ -f "$APK_PATH" ]; then
            echo "APK exists: $APK_PATH"
            ls -la "$APK_PATH"
            echo "=== APK Size ==="
            du -h "$APK_PATH"
            echo "=== SHA-256 ==="
            sha256sum "$APK_PATH"
          else
            echo "APK not found at $APK_PATH"
            echo "=== Searching for APK ==="
            find app/build -name "*.apk" -type f
            exit 1
          fi
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-apk-builder-debug
          path: capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      
      - name: Build summary
        run: |
          echo "=== ANDROID-BUILD-001 Build Summary ==="
          echo "Go binary: capacitor/android/app/src/main/assets/go/local-apk-builder"
          echo "APK: capacitor/android/app/build/outputs/apk/debug/app-debug.apk"
          echo "Status: SUCCESS"
          echo "================================"
